services:
  db:
    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}


    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  db-backup:
    image: postgres:17

    environment: 
      PGPASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      db:
        condition: service_healthy
    
    volumes:
      - ./backups:/backups
    
    command: >
      sh -c '
      while true; do
        pg_dump
        -h db
        -U "${POSTGRES_USER}"
        -d "${POSTGRES_DB}"
        -F c
        -f "/backups/backup_$$(date +%Y-%m-%d_%H-%M-%S).dump";

        find /backups
        -type f
        -name "backup_*.dump"
        -mtime +7
        -delete;

        sleep 86400;
      done
      '


  backend:
    build:
      context: ./backend


    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD","node","-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend


  nginx:
    image: nginx:alpine 

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  postgres_data:
