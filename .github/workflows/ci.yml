name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    needs: migrations
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: transcendence
          POSTGRES_PASSWORD: transcendence
          POSTGRES_DB: spygame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U transcendence -d spygame_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://transcendence:transcendence@localhost:5432/spygame_test
      APP_ORIGIN: https://localhost:8443

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: ./node_modules/.bin/prisma validate

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate

      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build


  migrations:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: transcendence
          POSTGRES_PASSWORD: transcendence
          POSTGRES_DB: spygame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U transcendence -d spygame_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://transcendence:transcendence@localhost:5432/spygame_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Check migration status
        run: ./node_modules/.bin/prisma migrate status


  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment file
        run: cp .env.example .env

      - name: Build Docker services
        run: docker compose build